<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-dot"></span>
            <h1 id="hostname">Pi Dashboard</h1>
        </div>
        <nav>
            <button class="tab active" data-tab="dashboard">Dashboard</button>
            <button class="tab" data-tab="services">Services</button>
            <button class="tab" data-tab="storage">Storage</button>
        </nav>
        <div class="meta">
            <span id="updated-at">—</span>
            <span id="conn" class="pill pill-ok" title="API status">live</span>
        </div>
    </header>

    <main>
        <!-- ============ TAB: DASHBOARD ============ -->
        <section id="tab-dashboard" class="tab-panel active">

            <div class="kpis">
                <div class="kpi-card">
                    <div class="kpi-label">CPU load</div>
                    <div class="kpi-value" id="kpi-cpu">—</div>
                    <div class="bar">
                        <div class="bar-fill" id="kpi-cpu-bar"></div>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Temperature</div>
                    <div class="kpi-value" id="kpi-temp">—</div>
                    <div class="kpi-sub" id="kpi-temp-note">SoC thermal zone</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Memory</div>
                    <div class="kpi-value" id="kpi-ram">—</div>
                    <div class="bar">
                        <div class="bar-fill" id="kpi-ram-bar"></div>
                    </div>
                    <div class="kpi-sub" id="kpi-ram-sub"></div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Uptime</div>
                    <div class="kpi-value" id="kpi-uptime">—</div>
                    <div class="kpi-sub" id="kpi-model"></div>
                </div>
            </div>

            <h2 class="section-title">Services</h2>
            <div id="dash-services" class="grid"></div>

            <h2 class="section-title">Drives</h2>
            <div id="dash-storage" class="grid"></div>
        </section>

        <!-- ============ TAB: SERVICES ============ -->
        <section id="tab-services" class="tab-panel">
            <div class="table-wrap">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Status</th>
                            <th>Service</th>
                            <th>Type</th>
                            <th>State</th>
                            <th>PID</th>
                            <th>Uptime</th>
                            <th>Memory</th>
                            <th>CPU</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody id="svc-tbody"></tbody>
                </table>
            </div>
        </section>

        <!-- ============ TAB: STORAGE ============ -->
        <section id="tab-storage" class="tab-panel">
            <div id="store-cards" class="grid"></div>
            <div class="table-wrap">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Device</th>
                            <th>Mount</th>
                            <th>Type</th>
                            <th>Kind</th>
                            <th>Size</th>
                            <th>Used</th>
                            <th>Free</th>
                            <th>Usage</th>
                        </tr>
                    </thead>
                    <tbody id="store-tbody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="foot">
        <span id="foot-os"></span> · poll paused when tab hidden ·
    </footer>

    <script src="/static/app.js"></script>
</body>

</html>
